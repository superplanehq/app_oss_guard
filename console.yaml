---
apiVersion: v1
kind: Console
metadata:
  canvasId: 25414c17-e388-4bed-b1ac-e9775823177a
  name: app-oss-guard
spec:
  layout:
  - h: 3
    i: setup-panel
    minH: 2
    minW: 2
    w: 2
    x: 0
    "y": 0
  - h: 3
    i: scan-main-panel
    minH: 2
    minW: 2
    w: 3
    x: 2
    "y": 0
  - h: 5
    i: readme
    minH: 3
    minW: 3
    w: 5
    x: 0
    "y": 3
  - h: 5
    i: scan-summary-table
    minH: 3
    minW: 4
    w: 5
    x: 0
    "y": 8
  - h: 5
    i: unapproved-deps-table
    minH: 4
    minW: 6
    w: 7
    x: 5
    "y": 8
  - h: 8
    i: license-stats-table
    minH: 4
    minW: 4
    w: 7
    x: 5
    "y": 0
  panels:
  - content:
      node: Setup
      showRun: true
      title: Setup
    id: setup-panel
    type: node
  - content:
      node: Scan main
      showRun: true
      title: Scan main
    id: scan-main-panel
    type: node
  - content:
      body: |
        OSS Guard helps you keep dependency licenses aligned with your project's license. It scans your repo on pull requests and gives you a dashboard view of what's on `main`.

        <details>
        <summary>Set up the repository</summary>

        1. Add a `LICENSE` file (or set `license` in `package.json` / `pyproject.toml`) in your repository.
        2. Connect GitHub on the canvas nodes and select the repository on **On Pull Request**.
        3. Run **Setup** with `owner/repo` to save the repository.
        4. Run **Scan main** to scan `main` and refresh the dashboard.
        5. Optional: add a `GITHUB_TOKEN` secret on **Run setup scan** and **Run license check** for private repositories.

        </details>

        <details>
        <summary>Add exceptions</summary>

        Add approved dependency exceptions in `osv-scanner.toml` at the repository root. OSS Guard passes `--config` so overrides apply to all lockfiles (including subdirectories like `web_src/`).

        </details>
      title: Quick Start
    id: readme
    type: markdown
  - content:
      dataSource:
        kind: memory
        namespace: ossGuardScanSummary
      render:
        columns:
        - field: repository
          label: Repository
        - field: project_license
          format: badge
          label: Project license
        - field: total_dependencies
          format: number
          label: Dependencies
        - field: unapproved_dependencies
          format: number
          label: Unapproved
        - field: last_checked_at
          format: relative
          label: Last scan
        kind: table
        sort:
          field: last_checked_at
          order: desc
      title: Latest scan
    id: scan-summary-table
    type: table
  - content:
      dataSource:
        kind: memory
        namespace: ossGuardUnapprovedDeps
      render:
        columns:
        - field: name
          label: Package
        - field: version
          label: Version
        - field: package_manager
          label: Ecosystem
        - field: license
          label: License
        kind: table
        sort:
          field: name
          order: asc
      title: Unapproved dependencies
    id: unapproved-deps-table
    type: table
  - content:
      dataSource:
        kind: memory
        namespace: ossGuardLicenseStats
      render:
        columns:
        - field: license
          label: License
        - field: dependency_count
          format: number
          label: Dependencies
        kind: table
        rowStyles:
        - field: approved
          op: eq
          tone: green
          value: 'true'
        - field: approved
          op: eq
          tone: red
          value: 'false'
        sort:
          field: dependency_count
          order: desc
      title: Licenses in use
    id: license-stats-table
    type: table
