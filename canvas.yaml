    type: TYPE_ACTION
  - component: runnerPython
    configuration:
      enable_setup_commands: true
      execution_mode: host
      execution_timeout_seconds: 900
      machine_type: aws-standard-1
      script: |
        import json
        import os
        import re
        import shutil
        import subprocess
        import tempfile

        LOGS = []

        def log(message):
            line = str(message)
            print(line, flush=True)
            LOGS.append(line)

        def log_command_result(label, result, max_lines=20):
            log(label + " exited with code " + str(result.returncode))
            stderr = (result.stderr or "").strip()
            if stderr:
                log(label + " stderr:")
                for line in stderr.splitlines()[-max_lines:]:
                    log("  " + line)

        PERMISSIVE = [
            "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
            "0BSD", "Unlicense", "CC0-1.0", "CC-BY-4.0", "Zlib", "MPL-2.0",
            "OpenSSL", "BlueOak-1.0.0",
        ]

        COMPATIBILITY = {
            "MIT": PERMISSIVE,
            "APACHE-2.0": PERMISSIVE,
            "BSD-2-CLAUSE": PERMISSIVE,
            "BSD-3-CLAUSE": PERMISSIVE,
            "ISC": PERMISSIVE,
            "0BSD": PERMISSIVE,
            "UNLICENSE": PERMISSIVE,
            "CC0-1.0": PERMISSIVE,
            "ZLIB": PERMISSIVE,
            "MPL-2.0": PERMISSIVE,
            "GPL-3.0": ["GPL-3.0", "GPL-2.0", "LGPL-3.0", "LGPL-2.1", "AGPL-3.0", "MPL-2.0"] + PERMISSIVE,
            "GPL-2.0": ["GPL-2.0", "LGPL-2.1"] + PERMISSIVE,
            "LGPL-3.0": ["LGPL-3.0", "GPL-3.0", "GPL-2.0", "LGPL-2.1", "MPL-2.0"] + PERMISSIVE,
            "LGPL-2.1": ["LGPL-2.1", "GPL-2.0"] + PERMISSIVE,
            "AGPL-3.0": ["AGPL-3.0", "GPL-3.0", "GPL-2.0"],
        }

        LICENSE_TEXT_PATTERNS = [
            (r"\bMIT License\b", "MIT"),
            (r"\bApache License, Version 2\.0\b", "Apache-2.0"),
            (r"\bApache License 2\.0\b", "Apache-2.0"),
            (r"\bBSD 2-Clause\b", "BSD-2-Clause"),
            (r"\bBSD 3-Clause\b", "BSD-3-Clause"),
            (r"\bISC License\b", "ISC"),
            (r"\bGNU GENERAL PUBLIC LICENSE\b[\s\S]*Version 3", "GPL-3.0"),
            (r"\bGNU GENERAL PUBLIC LICENSE\b[\s\S]*Version 2", "GPL-2.0"),
            (r"\bGNU LESSER GENERAL PUBLIC LICENSE\b[\s\S]*Version 3", "LGPL-3.0"),
            (r"\bGNU LESSER GENERAL PUBLIC LICENSE\b[\s\S]*Version 2\.1", "LGPL-2.1"),
            (r"\bGNU AFFERO GENERAL PUBLIC LICENSE\b[\s\S]*Version 3", "AGPL-3.0"),
        ]

        def normalize_license(value):
            return re.sub(r"[^A-Za-z0-9.+-]", "", str(value or "").strip()).upper()

        def detect_from_license_file(repo_dir):
            for name in ["LICENSE", "LICENSE.md", "LICENSE.txt", "COPYING", "COPYING.md"]:
                path = os.path.join(repo_dir, name)
                if not os.path.isfile(path):
                    continue
                try:
                    with open(path, encoding="utf-8", errors="ignore") as handle:
                        text = handle.read()
                except OSError:
                    continue

                spdx = re.search(r"SPDX-License-Identifier:\s*([A-Za-z0-9.+-]+)", text, re.I)
                if spdx:
                    return spdx.group(1)

                for pattern, spdx_id in LICENSE_TEXT_PATTERNS:
                    if re.search(pattern, text, re.I):
                        return spdx_id
            return None

        def detect_from_package_json(repo_dir):
            path = os.path.join(repo_dir, "package.json")
            if not os.path.isfile(path):
                return None
            try:
                with open(path, encoding="utf-8") as handle:
                    data = json.load(handle)
            except (OSError, json.JSONDecodeError):
                return None

            lic = data.get("license")
            if isinstance(lic, str) and lic.strip():
                return lic.strip()
            if isinstance(lic, dict) and lic.get("type"):
                return str(lic["type"]).strip()
            return None

        def detect_from_pyproject(repo_dir):
            path = os.path.join(repo_dir, "pyproject.toml")
            if not os.path.isfile(path):
                return None
            try:
                with open(path, encoding="utf-8") as handle:
                    text = handle.read()
            except OSError:
                return None

            match = re.search(r'^\s*license\s*=\s*"([^"]+)"', text, re.M)
            if match:
                return match.group(1)
            match = re.search(r'^\s*license\s*=\s*\{\s*text\s*=\s*"([^"]+)"', text, re.M)
            if match:
                return match.group(1)
            return None

        def detect_project_license(repo_dir):
            for detector in (detect_from_license_file, detect_from_package_json, detect_from_pyproject):
                found = detector(repo_dir)
                if found:
                    return found.strip()
            return None

        def approved_for_project(project_license):
            key = normalize_license(project_license)
            base = COMPATIBILITY.get(key, PERMISSIVE)
            approved = []
            seen = set()
            for lic in base:
                norm = normalize_license(lic)
                if not norm or norm in seen:
                    continue
                seen.add(norm)
                approved.append(lic.strip())
            return approved


        def dependency_key(dep):
            return (
                str(dep.get("package_manager") or ""),
                str(dep.get("name") or ""),
                str(dep.get("version") or ""),
            )

        def load_license_ignored_packages(repo_dir):
            config_path = os.path.join(repo_dir, "osv-scanner.toml")
            ignored = set()
            if not os.path.isfile(config_path):
                return ignored

            try:
                with open(config_path, encoding="utf-8") as handle:
                    text = handle.read()
            except OSError:
                log("Could not read osv-scanner config: " + config_path)
                return ignored

            for block in re.split(r"\[\[PackageOverrides\]\]", text)[1:]:
                name_match = re.search(r'^\s*name\s*=\s*"([^"]+)"', block, re.M)
                ecosystem_match = re.search(
                    r'^\s*ecosystem\s*=\s*"([^"]+)"',
                    block,
                    re.M,
                )
                if not name_match:
                    continue
                if not re.search(r"^\s*license\.ignore\s*=\s*true\s*$", block, re.M):
                    continue
                ecosystem = ecosystem_match.group(1) if ecosystem_match else ""
                ignored.add((ecosystem, name_match.group(1)))

            if ignored:
                log(
                    "Loaded " + str(len(ignored)) +
                    " license.ignore overrides from osv-scanner.toml"
                )
            return ignored

        def run_osv_scan(repo_dir, approved_str):
            command = [
                "osv-scanner",
                "scan",
                "source",
                "--recursive",
                "--format=json",
                "--all-packages",
                "--licenses=" + approved_str,
            ]
            config_path = os.path.join(repo_dir, "osv-scanner.toml")
            if os.path.isfile(config_path):
                command.append("--config=" + config_path)
                log("Using osv-scanner config: " + config_path)
            command.append(repo_dir)
            log("Running osv-scanner on " + repo_dir)
            result = subprocess.run(
                command,
                capture_output=True,
                text=True,
            )

            for line in (result.stderr or "").splitlines():
                line = line.strip()
                if line:
                    log(line)

            if not (result.stdout or "").strip():
                log_command_result("osv-scanner", result)
                return {"results": [], "license_summary": []}

            try:
                data = json.loads(result.stdout)
            except json.JSONDecodeError as error:
                log("Failed to parse osv-scanner JSON: " + str(error))
                log_command_result("osv-scanner", result)
                return {"results": [], "license_summary": []}

            return data

        def collect_dependencies(repo_dir, approved_str):
            data = run_osv_scan(repo_dir, approved_str)
            dependencies = []
            seen = set()

            for result in data.get("results") or []:
                source = (result.get("source") or {}).get("path") or ""
                log("Scan source: " + source)

                for entry in result.get("packages") or []:
                    package = entry.get("package") or {}
                    name = str(package.get("name") or "").strip()
                    version = str(package.get("version") or "").strip()
                    ecosystem = str(package.get("ecosystem") or "").strip()
                    if not name:
                        continue

                    raw_licenses = entry.get("licenses")
                    dep = {
                        "name": name,
                        "version": version,
                        "licenses": raw_licenses if raw_licenses is not None else [],
                        "package_manager": ecosystem,
                        "license_violations": entry.get("license_violations") or [],
                        "source": source,
                    }

                    key = dependency_key(dep)
                    if key in seen:
                        continue
                    seen.add(key)
                    dependencies.append(dep)

            for item in data.get("license_summary") or []:
                log(
                    "License summary: " + str(item.get("name") or "Unknown") +
                    " (" + str(item.get("count") or 0) + ")"
                )

            log("Collected " + str(len(dependencies)) + " total dependencies")
            return dependencies

        LICENSE_ALIASES = {
            "APACHE20": "APACHE-2.0",
            "APACHE2": "APACHE-2.0",
            "BSD2": "BSD-2-CLAUSE",
            "BSD3": "BSD-3-CLAUSE",
            "GPL3": "GPL-3.0",
            "GPL2": "GPL-2.0",
            "LGPL3": "LGPL-3.0",
            "MPL2": "MPL-2.0",
        }

        UNRECOGNIZED_LICENSES = {"UNKNOWN", "NONSTANDARD", "NON-STANDARD"}

        def canonical_license(value):
            normalized = normalize_license(value)
            if not normalized:
                return ""
            return LICENSE_ALIASES.get(normalized, normalized)

        def split_and_licenses(text):
            parts = re.split(r"\s+and\s+", text, flags=re.I)
            licenses = []
            for part in parts:
                canonical = canonical_license(part.strip())
                if canonical:
                    licenses.append(canonical)
            return licenses

        def parse_license_options(license_str):
            text = str(license_str or "").strip()
            if not text:
                return []

            if canonical_license(text) in UNRECOGNIZED_LICENSES:
                return []

            if re.search(r"\s+or\s+", text, flags=re.I):
                options = []
                for branch in re.split(r"\s+or\s+", text, flags=re.I):
                    and_group = split_and_licenses(branch)
                    if and_group:
                        options.append(and_group)
                return options

            if re.search(r"\s+and\s+", text, flags=re.I):
                and_group = split_and_licenses(text)
                return [and_group] if and_group else []

            if "," in text:
                options = []
                for part in text.split(","):
                    canonical = canonical_license(part.strip())
                    if canonical:
                        options.append([canonical])
                return options

            canonical = canonical_license(text)
            return [[canonical]] if canonical else []

        def license_expression_approved(license_str, approved_set):
            options = parse_license_options(license_str)
            if not options:
                return False

            for and_group in options:
                if all(lic in approved_set for lic in and_group):
                    return True
            return False

        def dependency_license_name(dep, ignored_packages=None):
            licenses = dep.get("licenses")
            if licenses is None:
                licenses = []
            if not licenses:
                key = (
                    str(dep.get("package_manager") or ""),
                    str(dep.get("name") or ""),
                )
                if ignored_packages and key in ignored_packages:
                    return "Ignored (osv-scanner.toml)"
                return "Unknown"
            if len(licenses) == 1:
                return str(licenses[0])
            return ", ".join(str(item) for item in licenses)

        def dependency_is_approved(dep, approved_set, ignored_packages=None):
            violations = dep.get("license_violations") or []
            if violations:
                return False

            licenses = dep.get("licenses")
            if licenses is None:
                licenses = []
            if not licenses:
                key = (
                    str(dep.get("package_manager") or ""),
                    str(dep.get("name") or ""),
                )
                return key in (ignored_packages or set())

            for license_name in licenses:
                if not license_expression_approved(license_name, approved_set):
                    return False
            return True

        def build_license_stats(dependencies, approved_set, ignored_packages=None):
            license_counts = {}
            unapproved_dependencies = 0

            for dep in dependencies:
                license_name = dependency_license_name(dep, ignored_packages)
                license_counts[license_name] = license_counts.get(license_name, 0) + 1

                if not dependency_is_approved(dep, approved_set, ignored_packages):
                    unapproved_dependencies += 1

            license_stats = []
            for license_name, count in sorted(license_counts.items()):
                license_stats.append({
                    "license": license_name,
                    "dependency_count": count,
                    "approved": "true"
                    if license_name == "Ignored (osv-scanner.toml)"
                    or license_expression_approved(license_name, approved_set)
                    else "false",
                })

            return license_stats, unapproved_dependencies

        def build_report(dependencies, approved_set, ignored_packages=None, limit=50):
            lines = []
            unapproved = [
                dep for dep in dependencies
                if not dependency_is_approved(dep, approved_set, ignored_packages)
            ]
            for dep in sorted(
                unapproved,
                key=lambda item: (str(item.get("name") or ""), str(item.get("version") or "")),
            )[:limit]:
                lines.append(
                    "{0} {1} ({2}) - {3}".format(
                        dep.get("name", ""),
                        dep.get("version", ""),
                        dep.get("package_manager", ""),
                        dependency_license_name(dep, ignored_packages),
                    )
                )

            remaining = len(unapproved) - len(lines)
            if remaining > 0:
                lines.append("... and {0} more unapproved dependencies".format(remaining))
            return "\n".join(lines)

        def build_unapproved_list(dependencies, approved_set, ignored_packages=None, limit=200):
            unapproved = [
                dep for dep in dependencies
                if not dependency_is_approved(dep, approved_set, ignored_packages)
            ]
            rows = []
            for dep in sorted(
                unapproved,
                key=lambda item: (str(item.get("name") or ""), str(item.get("version") or "")),
            )[:limit]:
                rows.append({
                    "name": str(dep.get("name") or ""),
                    "version": str(dep.get("version") or ""),
                    "package_manager": str(dep.get("package_manager") or ""),
                    "license": dependency_license_name(dep, ignored_packages),
                })
            return rows

        def tool_version(command):
            result = subprocess.run(
                command,
                capture_output=True,
                text=True,
            )
            if result.returncode != 0:
                return "unavailable"
            return (result.stdout or result.stderr or "").strip().splitlines()[0]

        def empty_result(repo, last_pr_number, reason):
            return {
                "valid": False,
                "project_license": "",
                "approved_licenses": "",
                "reason": reason,
                "report": "",
                "repository": repo,
                "last_pr_number": last_pr_number,
                "license_stats": [],
                "unapproved_dependencies_list": [],
                "summary": {
                    "total_dependencies": 0,
                    "unique_licenses": 0,
                    "unapproved_dependencies": 0,
                },
            }

        def run_scan(repo, checkout_mode, checkout_ref, last_pr_number):
            log("Tools: osv-scanner=" + tool_version(["osv-scanner", "--version"]))

            workdir = tempfile.mkdtemp()
            log("Working directory: " + workdir)

            try:
                clone_url = "https://github.com/{0}.git".format(repo)
                token = os.environ.get("GITHUB_TOKEN")
                if token:
                    clone_url = "https://x-access-token:{0}@github.com/{1}.git".format(token, repo)
                    log("Using authenticated GitHub clone")
                else:
                    log("Using public GitHub clone")

                repo_dir = os.path.join(workdir, "repo")
                if checkout_mode == "branch":
                    log("Cloning branch " + checkout_ref)
                    clone_result = subprocess.run(
                        ["git", "clone", "--depth", "1", "--branch", checkout_ref, clone_url, repo_dir],
                        capture_output=True,
                        text=True,
                    )
                    if clone_result.returncode != 0:
                        log("Branch clone failed, falling back to default branch checkout")
                        log_command_result("git clone", clone_result)
                        subprocess.run(
                            ["git", "clone", "--depth", "1", clone_url, repo_dir],
                            check=True,
                            capture_output=True,
                            text=True,
                        )
                        subprocess.run(
                            ["git", "checkout", checkout_ref],
                            cwd=repo_dir,
                            check=True,
                            capture_output=True,
                            text=True,
                        )
                else:
                    log("Cloning pull request head")
                    subprocess.run(
                        ["git", "clone", "--depth", "1", clone_url, repo_dir],
                        check=True,
                        capture_output=True,
                        text=True,
                    )
                    subprocess.run(
                        ["git", "fetch", "--depth", "1", "origin", checkout_ref],
                        cwd=repo_dir,
                        check=True,
                        capture_output=True,
                        text=True,
                    )
                    subprocess.run(
                        ["git", "checkout", checkout_ref],
                        cwd=repo_dir,
                        check=True,
                        capture_output=True,
                        text=True,
                    )

                log("Repository cloned to " + repo_dir)

                project_license = detect_project_license(repo_dir)
                if not project_license:
                    log("Could not detect project license from LICENSE, package.json, or pyproject.toml")
                    return empty_result(
                        repo,
                        last_pr_number,
                        "Could not detect a project license from LICENSE, package.json, or pyproject.toml in the repository.",
                    )

                log("Detected project license: " + project_license)

                approved = approved_for_project(project_license)
                approved_str = ",".join(approved)
                approved_set = set(normalize_license(item) for item in approved)
                log("Permitted dependency licenses: " + approved_str)

                ignored_packages = load_license_ignored_packages(repo_dir)

                dependencies = collect_dependencies(repo_dir, approved_str)
                license_stats, unapproved_dependencies = build_license_stats(
                    dependencies,
                    approved_set,
                    ignored_packages,
                )
                report = build_report(dependencies, approved_set, ignored_packages)
                unapproved_dependencies_list = build_unapproved_list(
                    dependencies,
                    approved_set,
                    ignored_packages,
                )
                valid = unapproved_dependencies == 0
                reason = ""
                if not valid:
                    reason = "One or more dependencies use licenses that are not compatible with the project license."

                log(
                    "Scan complete: " + str(len(dependencies)) + " dependencies, " +
                    str(len(license_stats)) + " license types, " +
                    str(unapproved_dependencies) + " unapproved"
                )
                if not valid:
                    log("Result: failed")
                else:
                    log("Result: passed")

                return {
                    "valid": valid,
                    "project_license": project_license,
                    "approved_licenses": approved_str,
                    "reason": reason,
                    "report": report,
                    "repository": repo,
                    "last_pr_number": last_pr_number,
                    "license_stats": license_stats,
                    "unapproved_dependencies_list": unapproved_dependencies_list,
                    "summary": {
                        "total_dependencies": len(dependencies),
                        "unique_licenses": len(license_stats),
                        "unapproved_dependencies": unapproved_dependencies,
                    },
                }
            except subprocess.CalledProcessError as error:
                log("Command failed: " + " ".join(str(part) for part in error.cmd))
                if error.stdout:
                    log("stdout: " + str(error.stdout).strip())
                if error.stderr:
                    log("stderr: " + str(error.stderr).strip())
                return empty_result(
                    repo,
                    last_pr_number,
                    "License check failed while running repository commands.",
                )
            finally:
                shutil.rmtree(workdir, ignore_errors=True)

        def main(payload):
            global LOGS
            LOGS = []

            read = (payload.get("Read config") or {}).get("data") or {}
            values = read.get("values") or []
            config = values[0] if values else {}
            if not isinstance(config, dict):
                config = {}
            repo = str(config.get("repository") or "").strip()
            if not repo:
                log("No repository configured in memory; run Setup first")
                return empty_result("", "", "No repository configured. Run Setup with owner/repo first.")
            branch = str(config.get("branch") or "main").strip() or "main"
            log("OSS Guard main scan started for " + repo + "@" + branch)
            return run_scan(repo, "branch", branch, "")
      setup_commands: |
        wget -qO /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
        chmod +x /tmp/osv-scanner
        sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
